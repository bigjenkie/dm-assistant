name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  # LLM eval is intentionally local-only: it routes through the Claude Code
  # subscription via the Agent SDK and cannot run in headless CI without
  # authenticated session state. Run `npm run test:eval` locally after
  # `claude login`.
